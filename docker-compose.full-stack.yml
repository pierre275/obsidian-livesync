# docker-compose.full-stack.yml
#
# Full bootstrap: CouchDB + livesync git-committer.
# Use the setup-stack.cjs script to populate .env.full-stack first:
#   node setup-stack.cjs
#
# Or manually:
#   cp .env.git-committer.example .env.full-stack
#   # add COUCHDB_*, CODEBERG_*, LIVESYNC_PASSPHRASE, COUCHDB_PORT, PUBLIC_HOST
#   docker compose -f docker-compose.full-stack.yml --env-file .env.full-stack up -d
#
services:
  couchdb:
    image: couchdb:3
    networks:
      - livesync
    ports:
      # COUCHDB_PORT is the externally-reachable port. Internally CouchDB
      # always listens on 5984.
      - "${COUCHDB_PORT}:5984"
    environment:
      COUCHDB_USER: ${COUCHDB_USER}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD}
    volumes:
      - ${COUCHDB_DATA_PATH}:/opt/couchdb/data
    healthcheck:
      # CouchDB takes a few seconds to initialise. git-committer must wait
      # until /_up returns 200 before running `livesync-cli sync`.
      test: ["CMD", "curl", "-fs", "http://localhost:5984/_up"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  git-committer:
    build:
      context: .
      dockerfile: src/apps/cli/Dockerfile
      target: git-committer
    networks:
      - livesync
    depends_on:
      couchdb:
        condition: service_healthy
    volumes:
      - ${VAULT_PATH}:/vault
      - ${LIVESYNC_DATA_PATH}:/data
    environment:
      LIVESYNC_DB_PATH: /data
      DEBOUNCE_SECS: ${DEBOUNCE_SECS:-30}
      VAULT_DIR: /vault
      GIT_REMOTE: ${GIT_REMOTE:-origin}
      GIT_BRANCH: ${GIT_BRANCH:-main}
      GIT_USER_NAME: ${GIT_USER_NAME}
      GIT_USER_EMAIL: ${GIT_USER_EMAIL}
      # CouchDB connection passed via env so `livesync-cli watch` does not have
      # to read settings.json — livesync's first sync mutates that file.
      COUCHDB_URI: ${COUCHDB_INTERNAL_URI:-http://couchdb:5984}
      COUCHDB_USER: ${COUCHDB_USER}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD}
      COUCHDB_DBNAME: ${COUCHDB_DBNAME}
      LIVESYNC_PASSPHRASE: ${LIVESYNC_PASSPHRASE}
      CODEBERG_USERNAME: ${CODEBERG_USERNAME}
      CODEBERG_TOKEN: ${CODEBERG_TOKEN}
      CODEBERG_REPO: ${CODEBERG_REPO}
    restart: unless-stopped

networks:
  livesync:
    driver: bridge
    enable_ipv6: false
